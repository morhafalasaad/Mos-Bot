# Render Blueprint — lets you deploy this repo via Render's "New -> Blueprint"
# flow instead of manually filling in every field. Render auto-detects this
# file when you connect the repo.
#
# type: worker = Background Worker (no bound port required, matches the
# README's recommended free-tier path). If you'd rather run it as a Web
# Service instead (so the health_server.py endpoint is externally reachable
# for uptime monitoring), change `type: worker` to `type: web` below.
#
# Variables marked `sync: false` are secrets: Render will prompt you to
# paste in the real value when you create the Blueprint, and it is never
# stored in this file or committed to git.

services:
  - type: worker
    name: mostaql-ai-assistant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Optional — leave blank in the Render dashboard to disable the
      # GitHub fallback feature entirely (app runs fine without it).
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      # Optional — only needed if Gemini rejects Render's region.
      - key: GEMINI_PROXY_URL
        sync: false
      # Non-secret settings with fixed values.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
