# Render Blueprint — mirrors the service that is actually deployed
# ("Mos-Bot", a free-tier Web Service in Oregon). Use it via Render's
# "New -> Blueprint" flow to recreate the service from scratch.
#
# Why a Web Service and not a Background Worker: health_server.py binds
# 0.0.0.0:$PORT, which Render's Web Service type requires, and it keeps the
# endpoint reachable for uptime monitoring (/ and /status, plus /health,
# which pings MongoDB and returns 503 when it is unreachable).
#
# healthCheckPath is intentionally left unset (matches the live service).
# If you set it to /health, Render will restart the instance whenever
# MongoDB is briefly unreachable, so only do that if you want that behaviour.
#
# Variables marked `sync: false` are secrets: Render will prompt you to
# paste in the real value when you create the Blueprint, and it is never
# stored in this file or committed to git.
#
# MONGODB_URI is REQUIRED (see config.py/_require) — it is the bot's durable
# persistence layer (seen-projects dedup, the score cache, the daily request
# counter, token-usage analytics, repost history, win/loss outcomes, and the
# auto-retry queue). Get a free-tier connection string from
# https://cloud.mongodb.com (an M0 cluster is plenty for this workload)
# before deploying this Blueprint — the service will fail to start without
# it, exactly like a missing Gemini key.

services:
  - type: web
    name: Mos-Bot
    runtime: python
    plan: free
    region: oregon
    branch: main
    # Deploys are triggered manually from the dashboard (as on the live service).
    autoDeployTrigger: "off"
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Required — see the note above. mongodb+srv://... connection string
      # from your Atlas cluster, including username/password.
      - key: MONGODB_URI
        sync: false
      # Optional — only used for an OPTIONAL, secondary human-readable
      # GitHub Issue/file record when Gemini itself is fully unavailable.
      # Not the retry-queue-of-record (that's MongoDB) — leave blank to
      # disable this feature entirely, the real retry mechanism is
      # unaffected either way.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      # Optional — only needed if Gemini rejects Render's region.
      - key: GEMINI_PROXY_URL
        sync: false
      # Non-secret settings with fixed values.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
