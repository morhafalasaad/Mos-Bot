# Keeps GitHub Actions versions (actions/checkout, actions/setup-python,
# etc. in .github/workflows/tests.yml) current automatically. This is the
# durable fix for the "Node.js 20 is deprecated... forced to run on
# Node.js 24" warning: both actions still DECLARE Node 20 in their metadata
# even though GitHub's runners already execute them on a newer runtime
# regardless (which is why the warning is non-blocking today) — the
# warning goes away once the action authors ship a release that declares
# the newer runtime, and Dependabot opens a PR the moment that happens
# rather than this requiring someone to notice and bump it by hand.
#
# Also keeps requirements.txt/requirements-dev.txt current (pip ecosystem
# below) — this is the part of "automated Python version currency" that
# Dependabot can actually do. IMPORTANT LIMITATION, stated explicitly so
# it isn't assumed away: Dependabot has NO package-ecosystem that bumps
# .python-version or runtime.txt themselves — it can tell you when a
# dependency drops support for your current Python version (see its
# "Python version" reporting), but it never opens a PR raising the Python
# version your project targets. Bumping .python-version + runtime.txt to
# a newer CPython series (e.g. 3.14 -> 3.15 once 3.15 is stable and every
# pinned dependency below supports it) stays a deliberate, manual edit —
# push it and .github/workflows/tests.yml runs all 183 tests against it
# automatically before you'd merge, but nothing currently opens that PR
# for you unannounced.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependency currency for requirements.txt / requirements-dev.txt.
  # Grouped into one weekly PR rather than one PR per package, since this
  # project's dependency set is small and a single reviewed/tested PR is
  # far less noisy than a dozen individual ones landing the same week.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
